<footer class="bg-gray-100 border-gray-200 dark:bg-gray-900 py-12">
  <div class="container">
    <h2 class="m-0 text-lg">{{'FOOTER.APP_TITLE'|translate}}</h2>
    <p class="text-gray-500 text-sm">
      {{'FOOTER.APP_DESC'|translate}}
    </p>

    <!-- inputs design  -->
    <div class="flex items-center gap-3 whitespace-nowrap">
      <input type="text" class="  border-gray-500 text-gray-900 text-sm rounded-lg block w-full p-2.5" [placeholder]="'FOOTER.EMAIL_PLACEHOLDER'|translate"/>
      <button class="btn-main">{{'FOOTER.SHARE_BTN'|translate}}</button>
    </div> 

    <hr />

    <!-- footer payment Details Design  -->
    <div class="pay-details flex justify-between items-center mt-8">
      <div class="flex items-center gap-2">
        <h3 class="text-sm m-0">{{'FOOTER.PAYMENT_PARTNERS'|translate}}</h3>
        <img src="./images/amazon-pay.png" width="50px" alt="amazon-pay" />
        <img src="./images/American-Express-Color.png" width="50px" alt="American-Express"/>
        <img src="./images/paypal.png" width="50px" alt="paypal" />
        <img src="./images/mastercard.webp" width="50px" alt="mastercard" />
      </div>

      <div class="flex items-center gap-2">
        <h3 class="text-sm m-0">{{'FOOTER.DELIVER_PARTNERS'|translate}}</h3>
        <img src="./images/get-google-play.png" width="100px" alt="google-play" />
        <img src="./images/get-apple-store.png" width="100px" alt="apple-store" />
      </div>
    </div>
  </div>
</footer>
